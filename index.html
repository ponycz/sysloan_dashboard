        function renderStats() {
            const stats = DATA.stats;
            const overduePct = stats.total_value > 0 ? (stats.overdue_value / stats.total_value * 100) : 0;
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card"><div class="stat-label">Úvěrů (s datem)</div><div class="stat-value">${formatNumber(stats.total_loans_with_date)}</div><div class="stat-sub">z ${formatNumber(stats.total_loans)} celkem</div></div>
                <div class="stat-card"><div class="stat-label">Celkem tranší</div><div class="stat-value">${formatNumber(stats.total_tranches)}</div><div class="stat-sub">všechny tranše</div></div>
                <div class="stat-card"><div class="stat-label">Objem úvěrů</div><div class="stat-value">${(stats.total_value / 1e9).toFixed(2)}</div><div class="stat-sub">mld. Kč</div></div>
                <div class="stat-card"><div class="stat-label">Velikost zástav</div><div class="stat-value">${(stats.total_collateral / 1e9).toFixed(2)}</div><div class="stat-sub">mld. Kč</div></div>
                <div class="stat-card"><div class="stat-label">Průměrné LTV</div><div class="stat-value">${stats.avg_ltv.toFixed(1)}%</div><div class="stat-sub">Loan-to-Value</div></div>
                <div class="stat-card success"><div class="stat-label">Splaceno</div><div class="stat-value success">${formatNumber(stats.splaceno_count)}</div><div class="stat-sub">${formatCurrency(stats.splaceno_value)}</div></div>
                <div class="stat-card warning"><div class="stat-label">Nesplaceno</div><div class="stat-value warning">${formatNumber(stats.nesplaceno_count)}</div><div class="stat-sub">${formatCurrency(stats.nesplaceno_value)}</div></div>
                <div class="stat-card danger"><div class="stat-label">Po splatnosti</div><div class="stat-value danger">${formatNumber(stats.overdue_count)}</div><div class="stat-sub">${formatCurrency(stats.overdue_value)} • ${overduePct.toFixed(1)} % objemu</div></div>
            `;
        }

        function renderAlerts(statusFilter = '') {
            const allAlerts = DATA.insights;
            
            // Filtrovat insights podle stavu splacení
            const alerts = statusFilter ? allAlerts.map(alert => {
                const filteredItems = alert.items.filter(item => {
                    if (statusFilter === 'splaceno') return item.stav_splaceni === 'Splaceno';
                    if (statusFilter === 'nesplaceno') return item.stav_splaceni === 'Nesplaceno';
                    return true;
                });
                if (filteredItems.length === 0) return null;
                return {
                    ...alert,
                    count: filteredItems.length,
                    value: filteredItems.reduce((sum, item) => sum + (item.value || item.pohledavka || item.preplatek || 0), 0),
                    items: filteredItems
                };
            }).filter(a => a !== null) : allAlerts;
            
            if (alerts.length === 0) {
                document.getElementById('alertsGrid').innerHTML = '<div class="empty-state"><div class="empty-state-icon">✅</div><p>Žádná upozornění</p></div>';
                return;
            }
            document.getElementById('alertsGrid').innerHTML = alerts.map((alert, idx) => `
                <div class="alert-card ${alert.type}" id="alert-${idx}">
                    <div class="alert-header" onclick="toggleAlert(${idx})">
                        <div class="alert-title">
                            <div class="alert-icon">${alert.type === 'danger' ? '🚨' : alert.type === 'warning' ? '⚠️' : 'ℹ️'}</div>
                            <span>${alert.title}</span>
                        </div>
                        <div class="alert-stats">
                            <span class="alert-count">${alert.count}×</span>
                            <span class="alert-value">${formatCurrency(alert.value)}</span>
                        </div>
                        <div class="alert-toggle">▼</div>
                    </div>
                    <div class="alert-content"><div class="alert-items">${renderAlertItems(alert)}</div></div>
                </div>
            `).join('');
        }

        function renderAlertItems(alert) {
            return alert.items.map(item => {
                const statusBadge = item.stav_splaceni ? `<span class="alert-item-status ${item.stav_splaceni === 'Splaceno' ? 'splaceno' : 'nesplaceno'}">${item.stav_splaceni}</span>` : '';
                const jistinaInfo = item.aktualniJistina !== null && item.aktualniJistina !== undefined ? ` • Akt. jistina: ${formatCurrency(item.aktualniJistina)}` : '';
                let meta;

                switch (alert.kind) {
                    case 'overdue':
                        meta = `${item.date} (${item.days} dní po) • ${formatCurrency(item.value)}${jistinaInfo}`;
                        break;
                    case 'combined':
                        meta = `${item.days} dní po • LTV ${item.ltv !== null ? item.ltv.toFixed(1) + '%' : '-'} • zástava ${formatCurrency(item.zastava || 0)} • ${formatCurrency(item.value)}`;
                        break;
                    case 'due':
                        meta = `${item.date} (za ${item.days} dní) • ${formatCurrency(item.value)}${jistinaInfo}`;
                        break;
                    case 'highltv':
                        meta = `LTV ${item.ltv.toFixed(1)}% • ${formatCurrency(item.value)}${jistinaInfo}`;
                        break;
                    case 'nocollateral':
                        meta = `Bez zástavy • ${formatCurrency(item.value)}${jistinaInfo}`;
                        break;
                    case 'lowrating':
                        meta = `Rating ${item.rating} • ${formatCurrency(item.value)}${jistinaInfo}`;
                        break;
                    case 'overframe':
                        meta = `+${formatCurrency(item.diff)} nad rámec • ${formatCurrency(item.uver)}`;
                        break;
                    case 'framefull':
                        meta = `Čerpáno ${item.pct.toFixed(1)} % rámce (${formatCurrency(item.value)} z ${formatCurrency(item.ramec)})`;
                        break;
                    case 'prolonged':
                        meta = `${item.prodlouzeni}× prodlouženo • ${formatCurrency(item.value)}${jistinaInfo}`;
                        break;
                    case 'pohledavka':
                        meta = `Pohledávka: ${formatCurrency(item.pohledavka)} • Úvěr: ${formatCurrency(item.value)}`;
                        break;
                    case 'preplatek':
                        meta = `Přeplatek: ${formatCurrency(item.preplatek)} • Úvěr: ${formatCurrency(item.value)}`;
                        break;
                    case 'dopredne':
                        meta = `Úvěr: ${formatCurrency(item.value)}${jistinaInfo}`;
                        break;
                    case 'predplacene':
                        meta = `${item.prepaidMonths} měs. • Úvěr: ${formatCurrency(item.value)}${jistinaInfo}`;
                        break;
                    case 'lowbank':
                        meta = `Rozdíl: ${formatCurrency(item.rozdil)} (účet: ${formatCurrency(item.bankAccountBalance)}, přeplatek: ${formatCurrency(item.preplatek)})`;
                        break;
                    case 'anomaly':
                        meta = `Jistina ${formatCurrency(item.aktualniJistina)} > úvěr ${formatCurrency(item.value)}`;
                        break;
                    case 'concentration':
                        meta = `${item.share.toFixed(1)} % portfolia • ${item.pocet} úvěrů • ${formatCurrency(item.value)}`;
                        break;
                    case 'quality':
                        meta = `Chybí: ${item.missing} • ${formatCurrency(item.value)}`;
                        break;
                    case 'exporterror':
                        meta = escapeHtml(item.error || 'neznámá chyba');
                        break;
                    case 'trend':
                        meta = escapeHtml(item.text || '');
                        break;
                    default:
                        meta = formatCurrency(item.value);
                }

                return `<div class="alert-item"><span class="alert-item-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span>${statusBadge}<span class="alert-item-meta">${meta}</span></div>`;
            }).join('');
        }

        function toggleAlert(idx) { document.getElementById(`alert-${idx}`).classList.toggle('expanded'); }

        // Barvy pro grafy podle motivu
        function getChartColors() {
            const isLight = document.body.classList.contains('light-mode');
            return {
                gridColor: isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.05)',
                tickColor: isLight ? '#555570' : '#8888a0',
                textColor: isLight ? '#1a1a2e' : '#f0f0f5'
            };
        }

            const ratingOrder = ['A+', 'A', 'A-', 'B+', 'B', 'B-', 'C+', 'C', 'C-', 'N/A'];
            const ratingStatsSorted = ratingStats.sort((a, b) => {

            const ratingColors = ratingStatsSorted.map(r => r.Rating.startsWith('A') ? 'rgba(16, 185, 129, 0.8)' : r.Rating.startsWith('B') ? 'rgba(59, 130, 246, 0.8)' : 'rgba(245, 158, 11, 0.8)');

            overviewCharts.loanSizeCount = new Chart(document.getElementById('loanSizeCountChart'), {
                type: 'bar', data: { labels: loanSizeDist.map(d => d.range), datasets: [{ label: 'Počet', data: loanSizeDist.map(d => d.count), backgroundColor: loanSizeColors, borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: chartColors.gridColor }, ticks: { color: chartColors.tickColor } }, x: { grid: { display: false }, ticks: { color: chartColors.tickColor } } } }
            });

            // 13. Výše úvěru – objem
            overviewCharts.loanSizeValue = new Chart(document.getElementById('loanSizeValueChart'), {
                type: 'bar', data: { labels: loanSizeDist.map(d => d.range), datasets: [{ label: 'Objem (mil. Kč)', data: loanSizeDist.map(d => d.value / 1e6), backgroundColor: loanSizeColors, borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: chartColors.gridColor }, ticks: { color: chartColors.tickColor } }, x: { grid: { display: false }, ticks: { color: chartColors.tickColor } } } }
            });

            // 14. Splatnost nesplacených – počet
            const today = new Date();
            const currentMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            const maturityData = DATA.monthly.filter(m => m.month >= currentMonth);
            
            overviewCharts.maturityCount = new Chart(document.getElementById('maturityCountChart'), {
                type: 'line', data: { labels: maturityData.map(m => m.month), datasets: [{ label: 'Počet úvěrů', data: maturityData.map(m => m['Loan ID']), borderColor: '#8b5cf6', backgroundColor: 'rgba(139, 92, 246, 0.1)', fill: true, tension: 0.4, pointRadius: 3 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: chartColors.gridColor }, ticks: { color: chartColors.tickColor } }, x: { grid: { display: false }, ticks: { color: '#8888a0', maxRotation: 45 } } } }
            });

            // 15. Splatnost nesplacených – objem
            overviewCharts.maturityValue = new Chart(document.getElementById('maturityValueChart'), {
                type: 'line', data: { labels: maturityData.map(m => m.month), datasets: [{ label: 'Objem (mil. Kč)', data: maturityData.map(m => m['Výše úvěru (Kč)'] / 1e6), borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.4, pointRadius: 3 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: chartColors.gridColor }, ticks: { color: chartColors.tickColor } }, x: { grid: { display: false }, ticks: { color: '#8888a0', maxRotation: 45 } } } }
            });

            // 16. + 17. Aging úvěrů po splatnosti (počet / objem) - čím déle, tím tmavší červená
            const aging = DATA.overdue_aging;
            const agingColors = ['rgba(245, 158, 11, 0.8)', 'rgba(249, 115, 22, 0.8)', 'rgba(239, 68, 68, 0.8)', 'rgba(220, 38, 38, 0.85)', 'rgba(153, 27, 27, 0.9)'];

            overviewCharts.agingCount = new Chart(document.getElementById('agingCountChart'), {
                type: 'bar', data: { labels: aging.map(a => a.range), datasets: [{ label: 'Počet', data: aging.map(a => a.count), backgroundColor: agingColors, borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: chartColors.gridColor }, ticks: { color: chartColors.tickColor } }, x: { grid: { display: false }, ticks: { color: chartColors.tickColor } } } }
            });

            overviewCharts.agingValue = new Chart(document.getElementById('agingValueChart'), {
                type: 'bar', data: { labels: aging.map(a => a.range), datasets: [{ label: 'Objem (mil. Kč)', data: aging.map(a => a.value / 1e6), backgroundColor: agingColors, borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: chartColors.gridColor }, ticks: { color: chartColors.tickColor } }, x: { grid: { display: false }, ticks: { color: chartColors.tickColor } } } }
            });
        }

        function populateFilters() {
            const buildOptions = values => values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
            const typeOptions = buildOptions(DATA.filters.typy);
            const ratingOptions = buildOptions(DATA.filters.ratings);
            const statusOptions = buildOptions(DATA.filters.stavy);
            document.getElementById('filterType').insertAdjacentHTML('beforeend', typeOptions);
            document.getElementById('filterRating').insertAdjacentHTML('beforeend', ratingOptions);
            document.getElementById('filterRatingTranche').insertAdjacentHTML('beforeend', ratingOptions);
            document.getElementById('filterStatus').insertAdjacentHTML('beforeend', statusOptions);
            document.getElementById('filterStatusTranche').insertAdjacentHTML('beforeend', statusOptions);
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('filterType').value;
            const rating = document.getElementById('filterRating').value;
            const status = document.getElementById('filterStatus').value;
            const ltv = document.getElementById('filterLTV').value;
            const problems = document.getElementById('filterProblems').value;

            filteredData = DATA.loans.filter(item => {
                if (search && !item.jmeno.toLowerCase().includes(search) && !(item.vlastnik || '').toLowerCase().includes(search)) return false;
                if (type && item.typ !== type) return false;
                if (rating && item.rating !== rating) return false;
                if (status && item.stav_splaceni !== status) return false;
                if (ltv) {
                    if (ltv === 'low' && (item.ltv_uveru === null || item.ltv_uveru > 60)) return false;
                    if (ltv === 'medium' && (item.ltv_uveru === null || item.ltv_uveru <= 60 || item.ltv_uveru > 75)) return false;
                    if (ltv === 'high' && (item.ltv_uveru === null || item.ltv_uveru <= 75)) return false;
                }
                if (problems) {
                    if (problems === 'overdue' && (item.days_to_maturity === null || item.days_to_maturity >= 0 || item.stav_splaceni === 'Splaceno')) return false;
                    if (problems === 'soon30' && (item.days_to_maturity === null || item.days_to_maturity < 0 || item.days_to_maturity > 30 || item.stav_splaceni === 'Splaceno')) return false;
                    if (problems === 'soon90' && (item.days_to_maturity === null || item.days_to_maturity < 0 || item.days_to_maturity > 90 || item.stav_splaceni === 'Splaceno')) return false;
                    if (problems === 'highltv' && (item.ltv_uveru === null || item.ltv_uveru <= 75)) return false;
                    if (problems === 'overframe' && !item.uver_nad_ramec) return false;
                    if (problems === 'prolonged' && !item.prodlouzeni) return false;
                    if (problems === 'nodate' && item.datum_parsed_valid) return false;
                    if (problems === 'preplatek' && (!item.preplatek || item.preplatek <= 0)) return false;
                    if (problems === 'dopredne' && item.interestType !== 'PeriodStart') return false;
                    if (problems === 'standardni' && item.interestType !== 'PeriodEnd') return false;
                    if (problems === 'predplacene' && (!item.prepaidInterestPeriodInMonths || item.prepaidInterestPeriodInMonths < 1)) return false;
                }
                return true;
            });

            if (sortColumn) {
                filteredData.sort((a, b) => {
                    let aVal = a[sortColumn], bVal = b[sortColumn];
                    if (sortColumn === 'datum_splatnosti') { aVal = a.datum_timestamp; bVal = b.datum_timestamp; }
                    if (aVal === null || aVal === undefined) aVal = sortDirection === 'asc' ? Infinity : -Infinity;
                    if (bVal === null || bVal === undefined) bVal = sortDirection === 'asc' ? Infinity : -Infinity;
                    if (typeof aVal === 'string') return sortDirection === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                    return sortDirection === 'asc' ? aVal - bVal : bVal - aVal;
                });
            }
            currentPage = 1;
            renderTable();
            document.getElementById('resultsCount').innerHTML = `Zobrazeno <strong>${filteredData.length}</strong> z ${DATA.loans.length}`;
        }

        function renderTable() {
            const start = (currentPage - 1) * pageSize, end = start + pageSize, pageData = filteredData.slice(start, end);
            const headers = ['Název úvěru', 'Vlastník', 'Typ', 'Tranší', 'Rating', 'LTV', 'Splatnost', 'Výše úvěru', 'Akt. jistina', 'Přeplatek', 'Úroky', 'Předpl.', 'Stav', 'Značky'];
            const headerColumns = ['jmeno', 'vlastnik', 'typ', 'tranches_count', 'rating', 'ltv_uveru', 'datum_splatnosti', 'vyse_uveru', 'aktualniJistina', 'preplatek', 'interestType', 'prepaidInterestPeriodInMonths', 'stav_splaceni', ''];

            document.getElementById('tableHeader').innerHTML = headers.map((h, i) => {
                const col = headerColumns[i];
                return `<th class="${sortColumn === col ? (sortDirection === 'asc' ? 'sorted-asc' : 'sorted-desc') : ''}" data-column="${col}">${h}</th>`;
            }).join('');

            if (pageData.length === 0) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="14" class="empty-state">Žádné záznamy</td></tr>';
            } else {
                document.getElementById('tableBody').innerHTML = pageData.map(item => {
                    const problems = [];
                    if (!item.datum_parsed_valid) problems.push(`<span class="badge badge-info">Bez data</span>`);
                    else if (item.days_to_maturity !== null && item.days_to_maturity < 0 && item.stav_splaceni !== 'Splaceno') problems.push(`<span class="badge badge-warning">Po splatnosti ${Math.abs(item.days_to_maturity)}d</span>`);
                    else if (item.days_to_maturity !== null && item.days_to_maturity <= 30 && item.days_to_maturity >= 0 && item.stav_splaceni !== 'Splaceno') problems.push(`<span class="badge badge-caution">Brzy ${item.days_to_maturity}d</span>`);
                    if (item.ltv_uveru > 75) problems.push(`<span class="badge badge-warning">LTV ${item.ltv_uveru.toFixed(0)}%</span>`);
                    if (item.uver_nad_ramec) problems.push(`<span class="badge badge-warning">Nad rámec</span>`);
                    if (item.prodlouzeni) problems.push(`<span class="badge badge-info">Prodl. ${item.prodlouzeni}×</span>`);

                    const ratingClass = (item.rating || '').startsWith('A') ? 'a' : (item.rating || '').startsWith('B') ? 'b' : 'c';
                    const statusClass = item.stav_splaceni === 'Splaceno' ? 'splaceno' : 'nesplaceno';
                    const ltv = item.ltv_uveru;
                    const ltvClass = ltv > 75 ? 'high' : ltv > 65 ? 'medium' : '';
                    const ltvBar = ltv !== null ? `<span class="ltv-bar"><span class="ltv-fill ${ltvClass}" style="width: ${Math.min(ltv, 100)}%"></span></span>` : '';
                    
                    // Úroky: D = dopředné (PeriodStart), S = standardní (PeriodEnd)
                    const interestDisplay = item.interestType === 'PeriodStart' ? 'D' : item.interestType === 'PeriodEnd' ? 'S' : '-';
                    // Předplacené úroky
                    const prepaidDisplay = item.prepaidInterestPeriodInMonths && item.prepaidInterestPeriodInMonths >= 1 ? item.prepaidInterestPeriodInMonths : '-';
                    // Barevné odlišení typu úvěru
                    const typeClass = item.typ === 'Jednorázový' ? 'jednorazovy' : item.typ === 'Tranšový' ? 'transovy' : '';

                    return `<tr>
                        <td class="cell-name" title="${escapeHtml(item.jmeno)}">${escapeHtml(item.jmeno)}</td>
                        <td class="cell-owner" title="${escapeHtml(item.vlastnik || '')}">${escapeHtml(item.vlastnik) || '-'}</td>
                        <td><span class="badge badge-type ${typeClass}">${escapeHtml(item.typ) || '-'}</span></td>
                        <td class="cell-number">${item.tranches_count || 1}</td>
                        <td><span class="badge badge-rating ${ratingClass}">${item.rating || '-'}</span></td>
                        <td class="cell-number">${formatPercent(ltv)} ${ltvBar}</td>
                        <td>${item.datum_splatnosti || '-'}</td>
                        <td class="cell-number">${formatCurrency(item.vyse_uveru)}</td>
                        <td class="cell-number">${item.aktualniJistina !== null && item.aktualniJistina !== undefined ? formatCurrency(item.aktualniJistina) : '-'}</td>
                        <td class="cell-number">${item.preplatek ? formatCurrency(item.preplatek) : '-'}</td>
                        <td class="cell-number">${interestDisplay}</td>
                        <td class="cell-number">${prepaidDisplay}</td>
                        <td><span class="badge badge-status ${statusClass}">${item.stav_splaceni || '-'}</span></td>
                        <td>${problems.join(' ') || '-'}</td>
                    </tr>`;
                }).join('');
            }

            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            document.getElementById('pageInfo').textContent = `Stránka ${currentPage} z ${totalPages} (${filteredData.length} záznamů)`;
            let buttons = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(1)">«</button><button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">‹</button>`;
            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) buttons += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            buttons += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">›</button><button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${totalPages})">»</button>`;
            document.getElementById('pageButtons').innerHTML = buttons;
        }

        function goToPage(page) { currentPage = page; renderTable(); }

        function applyFiltersTranche() {
            const search = document.getElementById('searchInputTranche').value.toLowerCase();
            const rating = document.getElementById('filterRatingTranche').value;
            const status = document.getElementById('filterStatusTranche').value;
            const ltv = document.getElementById('filterLTVTranche').value;

            filteredTranches = DATA.tranches.filter(item => {
                if (item.typ !== 'Tranšový') return false;
                if (search && !item.jmeno.toLowerCase().includes(search)) return false;
                if (rating && item.rating !== rating) return false;
                if (status && item.stav_splaceni !== status) return false;
                if (ltv) {
                    if (ltv === 'low' && (item.ltv_transe === null || item.ltv_transe > 60)) return false;
                    if (ltv === 'medium' && (item.ltv_transe === null || item.ltv_transe <= 60 || item.ltv_transe > 75)) return false;
                    if (ltv === 'high' && (item.ltv_transe === null || item.ltv_transe <= 75)) return false;
                }
                return true;
            });

            if (sortColumnTranche) {
                filteredTranches.sort((a, b) => {
                    let aVal = a[sortColumnTranche], bVal = b[sortColumnTranche];
                    if (sortColumnTranche === 'datum_splatnosti') { aVal = a.datum_timestamp; bVal = b.datum_timestamp; }
                    if (aVal === null || aVal === undefined) aVal = sortDirectionTranche === 'asc' ? Infinity : -Infinity;
                    if (bVal === null || bVal === undefined) bVal = sortDirectionTranche === 'asc' ? Infinity : -Infinity;
                    if (typeof aVal === 'string') return sortDirectionTranche === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                    return sortDirectionTranche === 'asc' ? aVal - bVal : bVal - aVal;
                });
            }
            currentPageTranche = 1;
            renderTranchesTable();
        }

        function renderTranchesTable() {
            const start = (currentPageTranche - 1) * pageSize, end = start + pageSize, pageData = filteredTranches.slice(start, end);
            const headers = ['Název úvěru', 'Tranše', 'Rating', 'LTV tranše', 'Splatnost', 'Výše tranše', 'Výše úvěru', 'Stav'];
            const headerColumns = ['jmeno', 'cislo_transe', 'rating', 'ltv_transe', 'datum_splatnosti', 'vyse_transe', 'vyse_uveru', 'stav_splaceni'];

            document.getElementById('trancheTableHeader').innerHTML = headers.map((h, i) => {
                const col = headerColumns[i];
                return `<th class="${sortColumnTranche === col ? (sortDirectionTranche === 'asc' ? 'sorted-asc' : 'sorted-desc') : ''}" data-column="${col}">${h}</th>`;
            }).join('');

            if (pageData.length === 0) {
                document.getElementById('trancheTableBody').innerHTML = '<tr><td colspan="8" class="empty-state">Žádné tranše</td></tr>';
            } else {
                document.getElementById('trancheTableBody').innerHTML = pageData.map(item => {
                    const ratingClass = (item.rating || '').startsWith('A') ? 'a' : (item.rating || '').startsWith('B') ? 'b' : 'c';
                    const statusClass = item.stav_splaceni === 'Splaceno' ? 'splaceno' : 'nesplaceno';
                    const ltv = item.ltv_transe;
                    const ltvClass = ltv > 75 ? 'high' : ltv > 65 ? 'medium' : '';
                    const ltvBar = ltv !== null ? `<span class="ltv-bar"><span class="ltv-fill ${ltvClass}" style="width: ${Math.min(ltv, 100)}%"></span></span>` : '';
                    return `<tr>
                        <td class="cell-name" title="${escapeHtml(item.jmeno)}">${escapeHtml(item.jmeno)}</td>
                        <td class="cell-number">${item.cislo_transe || '-'}</td>
                        <td><span class="badge badge-rating ${ratingClass}">${item.rating || '-'}</span></td>
                        <td class="cell-number">${formatPercent(ltv)} ${ltvBar}</td>
                        <td>${item.datum_splatnosti || '-'}</td>
                        <td class="cell-number">${formatCurrency(item.vyse_transe)}</td>
                        <td class="cell-number">${formatCurrency(item.vyse_uveru)}</td>
                        <td><span class="badge badge-status ${statusClass}">${item.stav_splaceni || '-'}</span></td>
                    </tr>`;
                }).join('');
            }

            const totalPages = Math.ceil(filteredTranches.length / pageSize) || 1;
            document.getElementById('pageInfoTranche').textContent = `Stránka ${currentPageTranche} z ${totalPages} (${filteredTranches.length} tranší)`;
            document.getElementById('resultsCountTranche').innerHTML = `Zobrazeno <strong>${filteredTranches.length}</strong> tranší`;
            let buttons = `<button class="page-btn" ${currentPageTranche === 1 ? 'disabled' : ''} onclick="goToPageTranche(1)">«</button><button class="page-btn" ${currentPageTranche === 1 ? 'disabled' : ''} onclick="goToPageTranche(${currentPageTranche - 1})">‹</button>`;
            for (let i = Math.max(1, currentPageTranche - 2); i <= Math.min(totalPages, currentPageTranche + 2); i++) buttons += `<button class="page-btn ${i === currentPageTranche ? 'active' : ''}" onclick="goToPageTranche(${i})">${i}</button>`;
            buttons += `<button class="page-btn" ${currentPageTranche === totalPages ? 'disabled' : ''} onclick="goToPageTranche(${currentPageTranche + 1})">›</button><button class="page-btn" ${currentPageTranche === totalPages ? 'disabled' : ''} onclick="goToPageTranche(${totalPages})">»</button>`;
            document.getElementById('pageButtonsTranche').innerHTML = buttons;
        }

        function goToPageTranche(page) { currentPageTranche = page; renderTranchesTable(); }

        function renderOwnersTab(statusFilter) {
            let ownerData = statusFilter === 'splaceno' ? DATA.owner_stats_splaceno : statusFilter === 'nesplaceno' ? DATA.owner_stats_nesplaceno : DATA.owner_stats_all;
            const topByValue = ownerData.slice(0, 20);
            const topByCount = [...ownerData].sort((a, b) => b.count - a.count).slice(0, 20);
            const chartColors = getChartColors();

            if (ownersValueChart) ownersValueChart.destroy();
            if (ownersCountChart) ownersCountChart.destroy();

            ownersValueChart = new Chart(document.getElementById('ownersValueChart'), {
                type: 'bar', data: { labels: topByValue.map(o => o.vlastnik.length > 35 ? o.vlastnik.slice(0, 35) + '...' : o.vlastnik), datasets: [{ label: 'Objem (mil. Kč)', data: topByValue.map(o => o.value / 1e6), backgroundColor: 'rgba(59, 130, 246, 0.7)', borderRadius: 4 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, grid: { color: chartColors.gridColor }, ticks: { color: chartColors.tickColor } }, y: { grid: { display: false }, ticks: { color: chartColors.tickColor, font: { size: 10 } } } } }
            });

            ownersCountChart = new Chart(document.getElementById('ownersCountChart'), {
                type: 'bar', data: { labels: topByCount.map(o => o.vlastnik.length > 35 ? o.vlastnik.slice(0, 35) + '...' : o.vlastnik), datasets: [{ label: 'Počet úvěrů', data: topByCount.map(o => o.count), backgroundColor: 'rgba(139, 92, 246, 0.7)', borderRadius: 4 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, grid: { color: chartColors.gridColor }, ticks: { color: chartColors.tickColor } }, y: { grid: { display: false }, ticks: { color: chartColors.tickColor, font: { size: 10 } } } } }
            });

            document.getElementById('ownersTableBody').innerHTML = ownerData.map(o => `<tr><td class="cell-name" title="${escapeHtml(o.vlastnik)}">${escapeHtml(o.vlastnik)}</td><td class="cell-number">${o.count}</td><td class="cell-number">${formatCurrency(o.value)}</td><td class="cell-number">${formatCurrency(o.value / o.count)}</td></tr>`).join('');
        }

        function setupEventListeners() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(tab.dataset.tab).classList.add('active');
                });
            });

            // Textové pole s debounce, selecty jen na change (aby filtr neběžel 2× ani při každém stisku klávesy)
            document.getElementById('searchInput').addEventListener('input', debounce(applyFilters, 200));
            ['filterType', 'filterRating', 'filterStatus', 'filterLTV', 'filterProblems'].forEach(id => {
                document.getElementById(id).addEventListener('change', applyFilters);
            });

            document.getElementById('resetFilters').addEventListener('click', () => {
                ['searchInput', 'filterType', 'filterRating', 'filterStatus', 'filterLTV', 'filterProblems'].forEach(id => document.getElementById(id).value = '');
                sortColumn = null; sortDirection = 'asc';
                applyFilters();
            });

            document.getElementById('tableHeader').addEventListener('click', (e) => {
                const th = e.target.closest('th');
                if (!th || !th.dataset.column) return;
                if (sortColumn === th.dataset.column) sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                else { sortColumn = th.dataset.column; sortDirection = 'asc'; }
                applyFilters();
            });

            document.getElementById('searchInputTranche').addEventListener('input', debounce(applyFiltersTranche, 200));
            ['filterRatingTranche', 'filterStatusTranche', 'filterLTVTranche'].forEach(id => {
                document.getElementById(id).addEventListener('change', applyFiltersTranche);
            });

            document.getElementById('resetFiltersTranche').addEventListener('click', () => {
                ['searchInputTranche', 'filterRatingTranche', 'filterStatusTranche', 'filterLTVTranche'].forEach(id => document.getElementById(id).value = '');
                sortColumnTranche = null; sortDirectionTranche = 'asc';
                applyFiltersTranche();
            });

            document.getElementById('trancheTableHeader').addEventListener('click', (e) => {
                const th = e.target.closest('th');
                if (!th || !th.dataset.column) return;
                if (sortColumnTranche === th.dataset.column) sortDirectionTranche = sortDirectionTranche === 'asc' ? 'desc' : 'asc';
                else { sortColumnTranche = th.dataset.column; sortDirectionTranche = 'asc'; }
                applyFiltersTranche();
            });

            document.getElementById('filterOwnersStatus').addEventListener('change', (e) => renderOwnersTab(e.target.value));
            document.getElementById('filterOverviewStatus').addEventListener('change', (e) => renderOverviewCharts(e.target.value));
            document.getElementById('filterInsightsStatus').addEventListener('change', (e) => renderAlerts(e.target.value));
            
            // Přepínač motivu a přesnosti
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('precisionToggle').addEventListener('click', togglePrecision);
        }

        // =============================================================================
        // START
        // =============================================================================
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
